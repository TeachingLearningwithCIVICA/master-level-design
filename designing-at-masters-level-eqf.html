const T = LANGS.en;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
function lookup(k){
  let m;
  if ((m = k.match(/^row(\d)$/))) return T.rows[+m[1]][0];
  if ((m = k.match(/^cell(\d)(\d)$/))) return T.rows[+m[1]][+m[2]];
  if ((m = k.match(/^tag(\d)$/))) return T.levelTags[+m[1]];
  if ((m = k.match(/^colH(\d)$/))) return T.colH[+m[1]];
  return T[k];
}
document.title = T.docTitle;
document.querySelectorAll("[data-k]").forEach(el => { el.textContent = lookup(el.dataset.k); });
$("using").innerHTML = T.using.map(p => `<p>${esc(p)}</p>`).join("");
$("pool").setAttribute("aria-label", T.poolLabel);
$("check").textContent = T.check; $("reset").textContent = T.reset;
const r = T.ref1;
$("t-ref1").innerHTML = `<strong>${esc(r[0])}</strong> ${esc(r[1])}<a href="${r[3]}" target="_blank" rel="noopener noreferrer">${esc(r[2])}<span class="sr-only">${esc(T.newTab)}</span></a>${esc(r[4])}`;
$("t-cite").innerHTML = esc(T.citation) + "<br>\n" + esc(T.developed);

/* ===== The sorter (the author's logic, unchanged) ===== */
const ITEMS = T.items;
let state = {};
ITEMS.forEach(it => { state[it.id] = { placed:null, checked:false }; });
function mkBtn(label, fn, aria, data){
  const b = document.createElement("button"); b.type = "button"; b.textContent = label;
  if (aria) b.setAttribute("aria-label", aria);
  Object.assign(b.dataset, data || {});
  b.addEventListener("click", fn); return b;
}
function makeStmt(it){
  const s = state[it.id];
  const div = document.createElement("div");
  div.className = "stmt" + (s.placed ? " placed" : "") + (s.checked && s.placed ? (s.placed === it.correct ? " correct" : " rethink") : "");
  div.setAttribute("role", "group"); div.setAttribute("aria-labelledby", "st-" + it.id);   /* buttons say which statement they act on */
  const p = document.createElement("p"); p.id = "st-" + it.id; p.textContent = it.text; div.appendChild(p);
  if (s.checked && s.placed){
    const ok = s.placed === it.correct;
    const why = document.createElement("div"); why.className = "why " + (ok ? "ok" : "no");
    why.innerHTML = "<i>" + esc(ok ? T.correctLead : fill(T.wrongLead, { n: it.correct })) + "</i>" + esc(it.why);
    div.appendChild(why);
  }
  const btns = document.createElement("div"); btns.className = "btns";
  if (s.placed){
    btns.appendChild(mkBtn(T.moveBack, () => setPlaced(it.id, null), T.moveBackLabel, { item: it.id, act: "back" }));
  } else {
    ["6","7","8"].forEach(lv => btns.appendChild(mkBtn(fill(T.levelBtn, { n: lv }), () => setPlaced(it.id, lv), fill(T.levelBtnLabel, { n: lv }), { item: it.id, act: lv })));
  }
  div.appendChild(btns); return div;
}
/* After a move the pressed button no longer exists, so focus follows the
   statement to its new place, and the move is announced. */
function setPlaced(id, level){
  state[id].placed = level; state[id].checked = false;
  $("score").textContent = "";
  render();
  const sel = level ? `button[data-item="${id}"][data-act="back"]` : `button[data-item="${id}"][data-act="6"]`;
  const target = document.querySelector(sel); if (target) target.focus();
  $("live").textContent = level ? fill(T.placedMsg, { level: T.colH[+level - 6] }) : T.movedBackMsg;
}
function render(){
  const cols = { "6":$("c6"), "7":$("c7"), "8":$("c8") }, pool = $("pool");
  pool.innerHTML = ""; cols["6"].innerHTML = ""; cols["7"].innerHTML = ""; cols["8"].innerHTML = "";
  ITEMS.forEach(it => { const node = makeStmt(it), placed = state[it.id].placed; (placed && cols[placed] ? cols[placed] : pool).appendChild(node); });
}
$("check").addEventListener("click", () => {
  let placed = 0, correct = 0;
  ITEMS.forEach(it => { if (state[it.id].placed){ state[it.id].checked = true; placed++; if (state[it.id].placed === it.correct) correct++; } });
  render();
  $("score").textContent = placed < ITEMS.length
    ? fill(T.scorePartial, { c: correct, p: placed, r: ITEMS.length - placed })
    : fill(T.scoreFull, { c: correct, t: ITEMS.length });
});
$("reset").addEventListener("click", () => {
  ITEMS.forEach(it => { state[it.id] = { placed:null, checked:false }; });
  $("score").textContent = ""; render(); $("live").textContent = T.resetMsg;
});
render();

/* ===== CIVICA frame ===== */
$("t-skip").textContent = T.skip; $("t-mark").setAttribute("aria-label", T.markLabel); $("t-mark-sub").textContent = T.markSub;
document.querySelectorAll('.attribution a[target="_blank"]').forEach(a => { const sp = document.createElement("span"); sp.className = "sr-only"; sp.textContent = T.newTab; a.appendChild(sp); });
$("t-lbl-author").textContent = T.lblAuthor; $("t-lbl-published").textContent = T.lblPublished;
$("t-lbl-part").textContent = T.lblPart; $("t-lbl-licence").textContent = T.lblLicence; $("t-funding").textContent = T.funding;
$("t-licence").innerHTML = esc(T.licence).replace("{link}", '<a href="' + LICENCE_URL + '" target="_blank" rel="noopener noreferrer license">' + esc(LICENCE_NAME) + '<span class="sr-only">' + esc(T.newTab) + '</span></a>');
const pd = $("published-date"); pd.setAttribute("datetime", PUBLISHED);
pd.textContent = new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" }).format(new Date(PUBLISHED + "T12:00:00Z"));
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>';
function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-icon").innerHTML = dark ? SUN : MOON;
  $("theme-label").textContent = dark ? T.themeToLight : T.themeToDark;
  $("theme-btn").setAttribute("aria-pressed", String(dark));
  $("theme-btn").setAttribute("aria-label", dark ? T.themeToLightLabel : T.themeToDarkLabel);
}
$("theme-btn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  updateThemeButton();
});
updateThemeButton();
})();
</script>
